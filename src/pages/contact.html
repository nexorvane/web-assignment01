<!-- CONTACT FORM -->
<section class="max-w-3xl mx-auto px-6 pb-20">

  <div class="bg-white rounded-lg shadow p-8">

    <h2 class="text-3xl font-bold mb-8">Send Us a Message</h2>

    <form
      id="contactForm"
      action="https://formspree.io/f/mrpbbvdl"
      method="POST"
      class="space-y-6"
    >

      <!-- Full Name -->
      <div>
        <label
          for="name"
          class="block mb-2 text-sm font-medium text-gray-900"
        >
          Full Name
        </label>

        <input
          type="text"
          id="name"
          name="name"
          minlength="2"
          required
          autocomplete="name"
          placeholder="Enter your full name"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3"
        >
      </div>

      <!-- Email -->
      <div>
        <label
          for="email"
          class="block mb-2 text-sm font-medium text-gray-900"
        >
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          placeholder="name@example.com"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3"
        >
      </div>

      <!-- Subject -->
      <div>
        <label
          for="subject"
          class="block mb-2 text-sm font-medium text-gray-900"
        >
          Subject
        </label>

        <input
          type="text"
          id="subject"
          name="subject"
          minlength="3"
          required
          placeholder="Enter subject"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3"
        >
      </div>

      <!-- Message -->
      <div>
        <label
          for="message"
          class="block mb-2 text-sm font-medium text-gray-900"
        >
          Message
        </label>

        <textarea
          id="message"
          name="message"
          rows="6"
          minlength="10"
          required
          placeholder="Write your message..."
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3"
        ></textarea>
      </div>

      <!-- Confirmation -->
      <div class="flex items-start">
        <input
          id="terms"
          name="terms"
          type="checkbox"
          value="confirmed"
          required
          class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded"
        >

        <label for="terms" class="ms-2 text-sm text-gray-600">
          I confirm that the information provided is accurate.
        </label>
      </div>

      <!-- Success/Error Message -->
      <div
        id="formMessage"
        class="hidden rounded-lg p-4 text-sm"
        role="alert"
      ></div>

      <!-- Submit -->
      <button
        id="submitButton"
        type="submit"
        class="w-full text-white bg-indigo-600 hover:bg-indigo-700
               focus:ring-4 focus:outline-none focus:ring-indigo-300
               font-medium rounded-lg text-sm px-5 py-3 text-center"
      >
        Send Message
      </button>

    </form>
  </div>
</section>

<script>
  const form = document.getElementById("contactForm");
  const button = document.getElementById("submitButton");
  const message = document.getElementById("formMessage");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    button.disabled = true;
    button.textContent = "Sending...";

    message.classList.add("hidden");
    message.classList.remove("text-green-800", "bg-green-100");
    message.classList.remove("text-red-800", "bg-red-100");

    const formData = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: formData,
        headers: {
          "Accept": "application/json"
        }
      });

      if (response.ok) {
        message.textContent =
          "Thank you! Your message has been sent successfully.";

        message.classList.remove("hidden");
        message.classList.add("text-green-800", "bg-green-100");

        form.reset();
      } else {
        const data = await response.json();

        let errorMessage = "Something went wrong. Please try again.";

        if (data.errors && data.errors.length > 0) {
          errorMessage = data.errors
            .map(error => error.message)
            .join(" ");
        }

        message.textContent = errorMessage;

        message.classList.remove("hidden");
        message.classList.add("text-red-800", "bg-red-100");
      }

    } catch (error) {
      message.textContent =
        "Unable to send your message. Please check your internet connection and try again.";

      message.classList.remove("hidden");
      message.classList.add("text-red-800", "bg-red-100");

    } finally {
      button.disabled = false;
      button.textContent = "Send Message";
    }
  });
</script>
